name: Автопостинг в Telegram
on:
  schedule:
    - cron: "7 * * * *"   # каждый час в :07
  workflow_dispatch:       # ручной запуск кнопкой
permissions:
  contents: write
concurrency:
  group: telegram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать просроченный пост
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
        run: python3 bot.py
      - name: Сохранить статус
        run: |
          git config user.name "feeriya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Опубликован пост" && git push)
